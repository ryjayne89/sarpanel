[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sarpanel"
version = "0.1.0"
description = "Sentinel-1 pixel time series over arbitrary polygons, with dated backscatter and acquisition-geometry columns"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ryan Jayne" },
    { name = "Dev Jyoti Ghosh Arnab" },
]
keywords = [
    "SAR",
    "Sentinel-1",
    "synthetic aperture radar",
    "remote sensing",
    "earth observation",
    "time series",
    "change detection",
    "land cover",
    "agriculture",
    "infrastructure monitoring",
    "geospatial",
    "pyroSAR",
    "ASF",
    "SNAP",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "rasterio>=1.3",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "asf-search>=7.0",
    "pyroSAR>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
sarpanel = "sarpanel.cli:main"

[project.urls]
Homepage = "https://github.com/ryjayne89/sarpanel"
Repository = "https://github.com/ryjayne89/sarpanel"
Issues = "https://github.com/ryjayne89/sarpanel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
# Pyflakes, pycodestyle, and import order. Newer ruff releases enable many
# extra rules by default; this selection keeps the check stable.
select = ["E", "F", "I"]
